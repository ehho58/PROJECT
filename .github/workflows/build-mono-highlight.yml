name: Build MonoHighlight APK

on:
  push:
    paths:
      - "mono-highlight/**"
      - ".github/workflows/build-mono-highlight.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mono-highlight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest には Android SDK が入っている（ANDROID_HOME 設定済み）
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MonoHighlight-apk
          path: mono-highlight/app/build/outputs/apk/release/*.apk
